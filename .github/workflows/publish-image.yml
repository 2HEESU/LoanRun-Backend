name: Publish Runtime Image

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'LoanRun-Team/LoanRun-Backend'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test application
        run: ./gradlew clean build --no-daemon
      - name: Validate HTTPS Compose configuration
        run: docker compose --env-file infra/production.env.example -f compose.production.yml config --quiet
      - name: Build and verify runtime image
        env:
          IMAGE_REPO: ghcr.io/loanrun-team/loanrun-backend
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:12}"
          SHA_TAG="${IMAGE_REPO}:sha-${SHORT_SHA}"
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/LoanRun-Team/LoanRun-Backend" \
            --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
            --tag "${SHA_TAG}" \
            .
          test "$(docker run --rm --network none --entrypoint id "${SHA_TAG}" -u)" = "10001"
          docker run --rm --network none --entrypoint java "${SHA_TAG}" -version
          docker run --rm --network none --entrypoint curl "${SHA_TAG}" --version
          echo "SHA_TAG=${SHA_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_REPO=${IMAGE_REPO}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified image tags
        run: |
          docker push "${SHA_TAG}"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${SHA_TAG}")"
          EXTRA_TAG=""
          if [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            EXTRA_TAG="${IMAGE_REPO}:dev"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            EXTRA_TAG="${IMAGE_REPO}:prod"
          fi
          if [ -n "${EXTRA_TAG}" ]; then
            docker tag "${SHA_TAG}" "${EXTRA_TAG}"
            docker push "${EXTRA_TAG}"
          fi
          {
            echo "### Published Runtime Image"
            echo "- Pinned tag: \`${SHA_TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            if [ -n "${EXTRA_TAG}" ]; then
              echo "- Branch tag: \`${EXTRA_TAG}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-test-results
          path: build/reports/tests/test
