name: Backend CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build --no-daemon
      - name: Build and check runtime image
        run: |
          docker build --pull --tag loanrun-backend:ci .
          test "$(docker run --rm --network none --entrypoint id loanrun-backend:ci -u)" = "10001"
          docker run --rm --network none --entrypoint java loanrun-backend:ci -version
      - name: Validate HTTPS Compose configuration
        run: docker compose --env-file infra/production.env.example -f compose.production.yml config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/test
